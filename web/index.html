<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skima</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 4 7l8 4 8-4-8-4Z" /><path d="m4 12 8 4 8-4" /><path d="m4 17 8 4 8-4" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>Skima</strong>
          <small>control plane</small>
        </span>
      </div>

      <nav aria-label="Sections">
        <a href="#/sources" data-route="sources">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="12" cy="6" rx="8" ry="3" /><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6" /><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" />
          </svg>
          <span>Sources</span>
        </a>
        <a href="#/explore" data-route="explore">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
          </svg>
          <span>Explore</span>
        </a>
        <a href="#/library" data-route="library">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h5v16H4zM11 4h4v16h-4z" /><path d="m17.5 5 3.2 15" />
          </svg>
          <span>Library</span>
        </a>
        <a href="#/review" data-route="review">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h11" /><path d="M4 17h7" /><circle cx="18" cy="7" r="2.5" /><circle cx="14" cy="17" r="2.5" />
          </svg>
          <span>Change review</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <p class="sidebar-foot-label">CLI</p>
        <code>./cli/skima check</code>
        <code>./cli/skima sync</code>
        <code>./cli/skima adopt</code>
        <code>./cli/skima install</code>
      </div>
    </aside>

    <main id="app"><p class="hint">Loading…</p></main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
